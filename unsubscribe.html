<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メール配信の停止 | ミートキャリア</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #F7F4EF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 440px;
      width: 100%;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #F5A623 0%, #F7B84E 100%);
      padding: 20px 32px;
      text-align: center;
    }
    .header img {
      max-width: 140px;
      height: auto;
    }
    .content {
      padding: 36px 32px;
      text-align: center;
    }
    .content h1 {
      font-size: 20px;
      color: #4A4A4A;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .content p {
      font-size: 14px;
      color: #8A8A8A;
      line-height: 1.8;
      margin-bottom: 24px;
    }
    .email-display {
      background: #F7F4EF;
      border-radius: 8px;
      padding: 12px 20px;
      margin-bottom: 28px;
      font-size: 15px;
      color: #4A4A4A;
      word-break: break-all;
    }
    .btn-unsubscribe {
      display: inline-block;
      background: linear-gradient(135deg, #F5A623 0%, #E8941A 100%);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 40px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-unsubscribe:hover {
      opacity: 0.9;
    }
    .btn-unsubscribe:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-cancel {
      display: inline-block;
      margin-top: 16px;
      font-size: 13px;
      color: #8A8A8A;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
    }
    .btn-cancel:hover {
      color: #4A4A4A;
    }

    /* ===== STATE: COMPLETED ===== */
    .completed { display: none; }
    .completed h1 { color: #5B9E9E; }
    .completed .check-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #E8F5F0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }

    .footer {
      padding: 20px 32px;
      text-align: center;
      border-top: 1px solid #E8E4DF;
    }
    .footer p {
      font-size: 12px;
      color: #AAAAAA;
      line-height: 1.6;
    }
    .footer a {
      color: #5B9E9E;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="https://work.meetcareer.net/assets/logo.jpg" alt="meetcareer">
    </div>

    <!-- ===== 確認画面 ===== -->
    <div class="content" id="confirm-view">
      <h1>メール配信を停止しますか？</h1>
      <p>
        以下のメールアドレスへの配信を停止します。<br>
        今後、ミートキャリアからのメールが届かなくなります。
      </p>
      <div class="email-display" id="email-display">
        読み込み中...
      </div>
      <button class="btn-unsubscribe" id="btn-unsubscribe" onclick="handleUnsubscribe()">
        配信を停止する
      </button>
      <br>
      <button class="btn-cancel" onclick="window.close(); history.back();">
        キャンセルして戻る
      </button>
    </div>

    <!-- ===== 完了画面 ===== -->
    <div class="content completed" id="done-view">
      <div class="check-icon">✓</div>
      <h1>配信を停止しました</h1>
      <p>
        今後、このメールアドレスへの配信は行われません。<br><br>
        またお会いできる日を楽しみにしています。<br>
        いつでもお気軽にお立ち寄りください。
      </p>
      <a href="https://www.meetcareer.net/?utm_source=brevo&utm_medium=email&utm_campaign=unsubscribe" class="btn-unsubscribe" style="font-size:14px; padding:12px 32px;">
        ミートキャリア公式サイトへ
      </a>
    </div>

    <div class="footer">
      <p>
        ミートキャリア 運営事務局
      </p>
    </div>
  </div>

  <script>
    // URLパラメータからメールを取得、ハッシュフラグメントからBrevo URLを取得
    const params = new URLSearchParams(window.location.search);
    const email = params.get('e');
    // ハッシュフラグメントにBrevoの配信停止URLを格納（&を含むURLでも安全）
    const brevoUrl = window.location.hash ? window.location.hash.substring(1) : null;

    // メールアドレス表示
    const emailDisplay = document.getElementById('email-display');
    if (email) {
      const parts = email.split('@');
      if (parts.length === 2) {
        const name = parts[0];
        const masked = name.substring(0, 2) + '***@' + parts[1];
        emailDisplay.textContent = masked;
      } else {
        emailDisplay.textContent = email;
      }
    } else {
      emailDisplay.textContent = 'ご登録のメールアドレス';
    }

    function handleUnsubscribe() {
      const btn = document.getElementById('btn-unsubscribe');
      btn.disabled = true;
      btn.textContent = '処理中...';

      if (brevoUrl) {
        // Brevoの配信停止URLに直接リダイレクト
        window.location.href = brevoUrl;
      } else {
        // フォールバック
        document.getElementById('confirm-view').style.display = 'none';
        document.getElementById('done-view').style.display = 'block';
      }
    }
  </script>

</body>
</html>
